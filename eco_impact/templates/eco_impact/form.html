{% extends "base.html" %}

{% block title %}{{ action }} Log — Eco Impact{% endblock %}

{% block content %}
<section style="padding:3rem 0;">
  <div class="section-container" style="max-width:600px;">
    <h1 class="section-title">{{ action }} Impact Log</h1>
    <form method="post" style="display:flex;flex-direction:column;gap:1.25rem;margin-top:2rem;">
      {% csrf_token %}
      {% for field in form %}
      <div>
        <label style="display:block;font-weight:600;margin-bottom:.4rem;color:var(--color-text);">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <p style="color:red;font-size:.85rem;">{{ field.errors.0 }}</p>
        {% endif %}
      </div>
      {% endfor %}
      <div style="display:flex;gap:1rem;">
        <button type="submit" class="btn btn--primary">Simpan</button>
        <a href="{% url 'eco_impact:dashboard' %}" class="btn btn--outline">Batal</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}

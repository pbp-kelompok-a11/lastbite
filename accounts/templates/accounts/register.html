{% extends 'base.html' %}
{% load static %}

{% block title %}Daftar — LastBite{% endblock %}

{% block content %}
<div class="section-container" style="min-height: 60vh; padding: 5rem 1rem; text-align: center;">
  <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Buat Akun Baru</h1>
  <p style="color: var(--color-text-muted);">Silakan gunakan formulir pendaftaran di atas.</p>
</div>
{% endblock %}

{% block extra_js %}
{{ block.super }}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof openAuthModal === 'function') {
      const urlParams = new URLSearchParams(window.location.search);
      const role = urlParams.get('role') || '{{ form.initial.role|default:"customer" }}';
      openAuthModal('register', role);
      {% if form and form.errors %}
        const errEl = document.getElementById('auth-register-errors');
        if (errEl) {
          errEl.hidden = false;
          errEl.innerHTML = '{{ form.errors|escapejs }}';
        }
      {% endif %}
    }
  });
</script>
{% endblock %}

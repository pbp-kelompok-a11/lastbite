{{ form.non_field_errors }}
{% for field in form %}
<div class="merchant-profile__field">
  {{ field.label_tag }}
  {{ field }}
  {{ field.errors }}
  {% if field.help_text %}
  <div class="profile-field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>
  {% endif %}
</div>
{% endfor %}

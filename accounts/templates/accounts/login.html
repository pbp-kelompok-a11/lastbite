{% extends 'base.html' %}
{% load static %}

{% block title %}Masuk — LastBite{% endblock %}

{% block content %}
<div class="section-container" style="min-height: 60vh; padding: 5rem 1rem; text-align: center;">
  <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Masuk ke LastBite</h1>
  <p style="color: var(--color-text-muted);">Silakan gunakan formulir masuk di atas.</p>
</div>
{% endblock %}

{% block extra_js %}
{{ block.super }}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof openAuthModal === 'function') {
      openAuthModal('login');
      {% if form and form.errors %}
        const errEl = document.getElementById('auth-login-errors');
        if (errEl) {
          errEl.hidden = false;
          errEl.innerHTML = '{{ form.errors|escapejs }}';
        }
      {% endif %}
    }
  });
</script>
{% endblock %}
